<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Banner</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.banner{
    width:1000px;
    height:260px;
    background:linear-gradient(135deg,#0A66C2,#004182);
    border-radius:20px;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:50px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.banner::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    top:-120px;
    right:-80px;
}

.banner::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    background:rgba(255,255,255,0.05);
    border-radius:50%;
    bottom:-100px;
    left:50%;
}

.content{
    z-index:2;
}

.content h1{
    font-size:42px;
    margin-bottom:10px;
}

.content p{
    font-size:18px;
    margin-bottom:20px;
    opacity:0.9;
}

.btn{
    display:inline-block;
    background:white;
    color:#0A66C2;
    text-decoration:none;
    padding:12px 28px;
    border-radius:30px;
    font-weight:600;
}

.profile{
    z-index:2;
    text-align:center;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    background:white;
    color:#0A66C2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    margin:auto;
    margin-bottom:15px;
}

.role{
    font-size:20px;
    font-weight:600;
}
</style>
</head>

<body>

<div class="banner">

    <div class="content">
        <h1>John Doe</h1>
        <p>Web Developer • UI/UX Designer • Freelancer</p>
        <a href="#" class="btn">Connect With Me</a>
    </div>

    <div class="profile">
        <div class="avatar">👨‍💻</div>
        <div class="role">Creative Professional</div>
    </div>

</div>

</body>
</html>
