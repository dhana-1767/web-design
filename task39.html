<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Slider</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.slider{
    width:90%;
    max-width:900px;
    height:500px;
    position:relative;
    overflow:hidden;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.slides{
    display:flex;
    width:100%;
    height:100%;
    transition:transform 0.5s ease-in-out;
}

.slide{
    min-width:100%;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Buttons */
.btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.5);
    color:white;
    border:none;
    padding:15px;
    cursor:pointer;
    font-size:22px;
    border-radius:50%;
}

.prev{
    left:15px;
}

.next{
    right:15px;
}

/* Dots */
.dots{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
}

.dot{
    display:inline-block;
    width:12px;
    height:12px;
    margin:0 5px;
    background:white;
    border-radius:50%;
    cursor:pointer;
    opacity:0.5;
}

.active{
    opacity:1;
}

/* Responsive */
@media(max-width:768px){
    .slider{
        height:300px;
    }

    .btn{
        padding:10px;
        font-size:18px;
    }
}
</style>
</head>
<body>

<div class="slider">

    <div class="slides">
        <div class="slide">
            <img src="https://picsum.photos/id/1015/900/500" alt="">
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1016/900/500" alt="">
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1018/900/500" alt="">
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1020/900/500" alt="">
        </div>
    </div>

    <button class="btn prev">&#10094;</button>
    <button class="btn next">&#10095;</button>

    <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

</div>

<script>
const slides = document.querySelector('.slides');
const dots = document.querySelectorAll('.dot');
const nextBtn = document.querySelector('.next');
const prevBtn = document.querySelector('.prev');

let index = 0;

function showSlide(i){
    if(i >= dots.length) index = 0;
    else if(i < 0) index = dots.length - 1;
    else index = i;

    slides.style.transform =
        `translateX(-${index * 100}%)`;

    dots.forEach(dot =>
        dot.classList.remove('active'));

    dots[index].classList.add('active');
}

nextBtn.addEventListener('click', () => {
    showSlide(index + 1);
});

prevBtn.addEventListener('click', () => {
    showSlide(index - 1);
});

dots.forEach((dot, i) => {
    dot.addEventListener('click', () => {
        showSlide(i);
    });
});

/* Auto Slide */
setInterval(() => {
    showSlide(index + 1);
}, 4000);
</script>

</body>
</html>
