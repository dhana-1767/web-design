<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homepage Wireframe</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.section{
    background:#fff;
    border:2px dashed #999;
    padding:40px;
    margin-bottom:20px;
    text-align:center;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav{
    display:flex;
    gap:20px;
}

.hero{
    height:400px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.feature-box{
    background:#eaeaea;
    border:2px dashed #999;
    padding:40px;
}

.about{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.image-placeholder{
    background:#eaeaea;
    border:2px dashed #999;
    height:250px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:#eaeaea;
    border:2px dashed #999;
    padding:30px;
}

.testimonial{
    height:150px;
}

.cta{
    background:#ddd;
}

.footer{
    padding:25px;
}

@media(max-width:768px){

    .header{
        flex-direction:column;
        gap:15px;
    }

    .features,
    .products,
    .about{
        grid-template-columns:1fr;
    }

    .hero{
        height:300px;
    }
}
</style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="section header">
        <h2>LOGO</h2>
        <div class="nav">
            <span>Home</span>
            <span>About</span>
            <span>Services</span>
            <span>Contact</span>
        </div>
    </div>

    <!-- Hero -->
    <div class="section hero">
        <h1>Hero Section</h1>
        <p>Main headline and call-to-action</p>
        <br>
        <button>Get Started</button>
    </div>

    <!-- Features -->
    <div class="section">
        <h2>Features</h2>
        <br>
        <div class="features">
            <div class="feature-box">Feature 1</div>
            <div class="feature-box">Feature 2</div>
            <div class="feature-box">Feature 3</div>
        </div>
    </div>

    <!-- About -->
    <div class="section">
        <h2>About Us</h2>
        <br>
        <div class="about">
            <div class="image-placeholder">Image</div>
            <div class="image-placeholder">Content</div>
        </div>
    </div>

    <!-- Products -->
    <div class="section">
        <h2>Services / Products</h2>
        <br>
        <div class="products">
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
        </div>
    </div>

    <!-- Testimonials -->
    <div class="section testimonial">
        <h2>Testimonials</h2>
        <p>Customer reviews go here</p>
    </div>

    <!-- CTA -->
    <div class="section cta">
        <h2>Call To Action</h2>
        <br>
        <button>Sign Up Now</button>
    </div>

    <!-- Footer -->
    <div class="section footer">
        Footer | Links | Social Media | Contact
    </div>

</div>

</body>
</html>
