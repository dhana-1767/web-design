<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidebar Menu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    min-height:100vh;
    background:#f4f4f4;
}

/* Sidebar */
.sidebar{
    width:250px;
    background:#2c3e50;
    color:white;
    height:100vh;
    position:fixed;
    left:0;
    top:0;
}

.logo{
    text-align:center;
    padding:20px;
    font-size:24px;
    font-weight:bold;
    border-bottom:1px solid rgba(255,255,255,0.2);
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.sidebar ul li a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
    transition:0.3s;
}

.sidebar ul li a:hover{
    background:#34495e;
    padding-left:30px;
}

/* Main Content */
.content{
    margin-left:250px;
    padding:30px;
    width:100%;
}

.content h1{
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">My Menu</div>

    <ul>
        <li><a href="#">🏠 Dashboard</a></li>
        <li><a href="#">👤 Profile</a></li>
        <li><a href="#">📊 Analytics</a></li>
        <li><a href="#">📁 Projects</a></li>
        <li><a href="#">⚙ Settings</a></li>
        <li><a href="#">📞 Contact</a></li>
        <li><a href="#">🚪 Logout</a></li>
    </ul>
</div>

<div class="content">
    <h1>Dashboard</h1>
    <p>Welcome to the sidebar menu design example.</p>
</div>

</body>
</html>
