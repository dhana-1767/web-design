<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    padding:20px;
}

.forgot-container{
    width:100%;
    max-width:400px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

.icon{
    font-size:60px;
    margin-bottom:15px;
}

h2{
    color:#333;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:25px;
    line-height:1.6;
}

.input-group{
    margin-bottom:20px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

.input-group input:focus{
    border-color:#2575fc;
}

.reset-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2575fc;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.reset-btn:hover{
    background:#1a5ed8;
}

.back-login{
    margin-top:20px;
}

.back-login a{
    text-decoration:none;
    color:#2575fc;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="forgot-container">

    <div class="icon">🔒</div>

    <h2>Forgot Password?</h2>

    <p>
        Enter your registered email address and we'll send
        you a link to reset your password.
    </p>

    <form>
        <div class="input-group">
            <input type="email"
                   placeholder="Enter your email address"
                   required>
        </div>

        <button type="submit" class="reset-btn">
            Send Reset Link
        </button>
    </form>

    <div class="back-login">
        <a href="#">← Back to Login</a>
    </div>

</div>

</body>
</html>
