<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Story Design</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.story{
    width:360px;
    height:640px;
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
    border-radius:25px;
    color:white;
    padding:25px;
    position:relative;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:60px;
}

.brand{
    font-size:22px;
    font-weight:700;
}

.logo{
    width:45px;
    height:45px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.content{
    text-align:center;
    margin-top:80px;
}

.offer{
    font-size:55px;
    font-weight:bold;
    line-height:1;
}

.subtitle{
    font-size:20px;
    margin-top:15px;
    letter-spacing:2px;
}

.desc{
    margin-top:20px;
    font-size:16px;
    opacity:0.9;
}

.btn{
    display:inline-block;
    margin-top:35px;
    padding:14px 35px;
    background:white;
    color:#ff416c;
    text-decoration:none;
    border-radius:40px;
    font-weight:600;
}

.circle1,
.circle2{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
}

.circle1{
    width:220px;
    height:220px;
    top:-70px;
    right:-70px;
}

.circle2{
    width:180px;
    height:180px;
    bottom:-50px;
    left:-50px;
}

.product{
    font-size:100px;
    margin-top:30px;
}
</style>
</head>

<body>

<div class="story">

    <div class="circle1"></div>
    <div class="circle2"></div>

    <div class="top-bar">
        <div class="brand">YOUR BRAND</div>
        <div class="logo">🛍️</div>
    </div>

    <div class="content">
        <div class="offer">50% OFF</div>
        <div class="subtitle">SUMMER SALE</div>

        <div class="desc">
            Discover amazing deals on your favorite products.
        </div>

        <a href="#" class="btn">Swipe Up</a>

        <div class="product">👟</div>
    </div>

</div>

</body>
</html>
