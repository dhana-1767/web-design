<!DOCTYPE html>
<html>
<head>
<title>Banner Advertisement</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.banner{
    width:900px;
    height:250px;
    background:linear-gradient(135deg,#ff6b6b,#ffb347);
    border-radius:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:30px;
    color:white;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.content h1{
    font-size:42px;
    margin-bottom:10px;
}

.content p{
    font-size:18px;
    margin-bottom:20px;
}

.btn{
    background:white;
    color:#ff6b6b;
    padding:12px 25px;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}

.image{
    font-size:120px;
}
</style>
</head>
<body>

<div class="banner">
    <div class="content">
        <h1>Summer Sale 50% OFF</h1>
        <p>Shop the latest collection and save big today.</p>
        <a href="#" class="btn">Shop Now</a>
    </div>
    <div class="image">
        🛍️
    </div>
</div>

</body>
</html>
