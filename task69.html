<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typography Hierarchy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f5f7fa;
    padding:50px;
    color:#333;
}

.container{
    max-width:800px;
    margin:auto;
    background:#fff;
    padding:40px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.display{
    font-size:56px;
    font-weight:700;
    margin-bottom:20px;
}

.h1{
    font-size:42px;
    font-weight:700;
    margin-bottom:15px;
}

.h2{
    font-size:32px;
    font-weight:600;
    margin-bottom:12px;
}

.h3{
    font-size:24px;
    font-weight:600;
    margin-bottom:10px;
}

.subtitle{
    font-size:20px;
    color:#666;
    margin-bottom:20px;
}

.body{
    font-size:16px;
    line-height:1.8;
    margin-bottom:20px;
}

.caption{
    font-size:13px;
    color:#888;
    margin-bottom:25px;
}

.button{
    display:inline-block;
    padding:12px 24px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:6px;
    font-weight:600;
}
</style>
</head>

<body>

<div class="container">

    <div class="display">Display Heading</div>

    <div class="h1">Heading 1</div>

    <div class="h2">Heading 2</div>

    <div class="h3">Heading 3</div>

    <div class="subtitle">
        Subtitle or Supporting Heading
    </div>

    <div class="body">
        This is the body text used for articles, blog posts,
        and general content. A good typography hierarchy
        improves readability and user experience.
    </div>

    <div class="caption">
        Caption Text • Last Updated June 2026
    </div>

    <a href="#" class="button">Read More</a>

</div>

</body>
</html>
