<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Template</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Georgia', serif;
}

body{
    background:#f3f4f6;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.certificate{
    width:1000px;
    background:white;
    border:12px solid #d4af37;
    padding:60px;
    position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.certificate::before{
    content:"";
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    bottom:15px;
    border:2px solid #d4af37;
}

.header{
    text-align:center;
    margin-bottom:40px;
}

.logo{
    font-size:60px;
    margin-bottom:10px;
}

.title{
    font-size:42px;
    color:#d4af37;
    font-weight:bold;
    letter-spacing:2px;
}

.subtitle{
    font-size:18px;
    color:#666;
    margin-top:10px;
}

.content{
    text-align:center;
    margin-top:40px;
}

.presented{
    font-size:22px;
    color:#555;
}

.name{
    font-size:48px;
    color:#111827;
    font-weight:bold;
    margin:25px 0;
    border-bottom:2px solid #d4af37;
    display:inline-block;
    padding-bottom:10px;
}

.description{
    font-size:20px;
    line-height:1.8;
    color:#444;
    max-width:700px;
    margin:0 auto;
}

.footer{
    display:flex;
    justify-content:space-between;
    margin-top:80px;
}

.signature{
    text-align:center;
}

.line{
    width:220px;
    border-top:2px solid #333;
    margin-bottom:10px;
}

.date{
    text-align:center;
}

.seal{
    position:absolute;
    right:70px;
    bottom:120px;
    width:100px;
    height:100px;
    border:4px solid #d4af37;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#d4af37;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="certificate">

    <div class="header">
        <div class="logo">🏆</div>

        <div class="title">
            CERTIFICATE OF ACHIEVEMENT
        </div>

        <div class="subtitle">
            This certificate is proudly presented to
        </div>
    </div>

    <div class="content">

        <div class="name">
            STUDENT NAME
        </div>

        <div class="description">
            For successfully completing the course
            and demonstrating outstanding dedication,
            knowledge, and performance throughout the program.
        </div>

    </div>

    <div class="seal">
        VERIFIED
    </div>

    <div class="footer">

        <div class="signature">
            <div class="line"></div>
            <strong>Authorized Signature</strong>
        </div>

        <div class="date">
            <div class="line"></div>
            <strong>Date</strong>
        </div>

    </div>

</div>

</body>
</html>
