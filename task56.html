<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrolling Effects</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

/* Hero Section */
.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    color:white;
    font-size:3rem;
}

/* Content Sections */
.section{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Animation Base */
.animate{
    opacity:0;
    transition:all 1s ease;
}

/* Fade In */
.fade-in{
    transform:translateY(40px);
}

.fade-in.show{
    opacity:1;
    transform:translateY(0);
}

/* Slide Left */
.slide-left{
    transform:translateX(-100px);
}

.slide-left.show{
    opacity:1;
    transform:translateX(0);
}

/* Zoom In */
.zoom-in{
    transform:scale(0.7);
}

.zoom-in.show{
    opacity:1;
    transform:scale(1);
}

/* Card Style */
.card{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    font-size:2rem;
}
</style>
</head>
<body>

<div class="hero">
    Scroll Down ↓
</div>

<section class="section">
    <div class="card animate fade-in">
        Fade In Effect
    </div>
</section>

<section class="section">
    <div class="card animate slide-left">
        Slide Left Effect
    </div>
</section>

<section class="section">
    <div class="card animate zoom-in">
        Zoom In Effect
    </div>
</section>

<script>
const elements = document.querySelectorAll(".animate");

const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }
    });
});

elements.forEach(element => {
    observer.observe(element);
});
</script>

</body>
</html>
