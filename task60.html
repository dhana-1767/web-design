<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Icon Set</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    padding:40px;
}

.icon-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:20px;
}

.icon-card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.icon-card:hover{
    transform:translateY(-5px);
}

.icon{
    width:50px;
    height:50px;
    stroke:#2563eb;
    stroke-width:2;
    fill:none;
    margin-bottom:10px;
}
</style>
</head>
<body>

<div class="icon-grid">

    <!-- Home Icon -->
    <div class="icon-card">
        <svg class="icon" viewBox="0 0 24 24">
            <path d="M3 10L12 3L21 10"/>
            <path d="M5 10V21H19V10"/>
        </svg>
        <p>Home</p>
    </div>

    <!-- Search Icon -->
    <div class="icon-card">
        <svg class="icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <line x1="16" y1="16" x2="21" y2="21"/>
        </svg>
        <p>Search</p>
    </div>

    <!-- User Icon -->
    <div class="icon-card">
        <svg class="icon" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21C4 17 8 15 12 15C16 15 20 17 20 21"/>
        </svg>
        <p>User</p>
    </div>

    <!-- Settings Icon -->
    <div class="icon-card">
        <svg class="icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2V5M12 19V22M2 12H5M19 12H22
                     M4.9 4.9L7 7M17 17L19.1 19.1
                     M4.9 19.1L7 17M17 7L19.1 4.9"/>
        </svg>
        <p>Settings</p>
    </div>

</div>

</body>
</html>
