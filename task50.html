<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Mode UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    color:#333;
    transition:0.3s;
}

/* Navbar */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:#ffffff;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.toggle-btn{
    padding:10px 18px;
    border:none;
    border-radius:25px;
    background:#333;
    color:white;
    cursor:pointer;
}

/* Content Card */
.container{
    display:flex;
    justify-content:center;
    margin-top:60px;
}

.card{
    width:350px;
    padding:25px;
    background:white;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    text-align:center;
}

.card h2{
    margin-bottom:15px;
}

/* Dark Theme */
.dark-mode{
    background:#121212;
    color:#ffffff;
}

.dark-mode .navbar{
    background:#1e1e1e;
}

.dark-mode .card{
    background:#242424;
    color:white;
}

.dark-mode .toggle-btn{
    background:#f1f1f1;
    color:#121212;
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo">My Website</div>
    <button class="toggle-btn" onclick="toggleMode()">
        🌙 Dark Mode
    </button>
</nav>

<div class="container">
    <div class="card">
        <h2>Welcome</h2>
        <p>
            Click the button to switch between
            light mode and dark mode.
        </p>
    </div>
</div>

<script>
function toggleMode(){
    document.body.classList.toggle("dark-mode");
}
</script>

</body>
</html>
