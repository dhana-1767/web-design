<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reusable Components</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f7fb;
    padding:40px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.section{
    background:#fff;
    padding:30px;
    margin-bottom:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#2563eb;
}

h2{
    margin-bottom:20px;
}

/* Buttons */
.btn{
    padding:12px 24px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-weight:600;
    margin:5px;
}

.btn-primary{background:#2563eb;}
.btn-success{background:#16a34a;}
.btn-danger{background:#dc2626;}

/* Cards */
.card{
    background:#f8fafc;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

/* Badge */
.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    color:white;
    font-size:12px;
    font-weight:600;
}

.badge-primary{background:#2563eb;}
.badge-success{background:#16a34a;}

/* Input */
.input{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-bottom:15px;
}

/* Alert */
.alert{
    padding:15px;
    border-radius:8px;
    color:white;
    margin-bottom:10px;
}

.alert-success{background:#16a34a;}
.alert-error{background:#dc2626;}

/* Avatar */
.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
}

/* Modal Preview */
.modal{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:20px;
    max-width:400px;
}

/* Progress Bar */
.progress{
    width:100%;
    background:#e5e7eb;
    height:12px;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:75%;
    height:100%;
    background:#2563eb;
}
</style>
</head>
<body>

<div class="container">

<h1>🧩 Reusable UI Components</h1>

<!-- Buttons -->
<div class="section">
<h2>Buttons</h2>

<button class="btn btn-primary">Primary</button>
<button class="btn btn-success">Success</button>
<button class="btn btn-danger">Danger</button>
</div>

<!-- Cards -->
<div class="section">
<h2>Cards</h2>

<div class="card">
<h3>Card Title</h3>
<p>Reusable card component for content.</p>
</div>
</div>

<!-- Badges -->
<div class="section">
<h2>Badges</h2>

<span class="badge badge-primary">New</span>
<span class="badge badge-success">Active</span>
</div>

<!-- Inputs -->
<div class="section">
<h2>Form Inputs</h2>

<input class="input" type="text" placeholder="Enter your name">
<input class="input" type="email" placeholder="Enter your email">
</div>

<!-- Alerts -->
<div class="section">
<h2>Alerts</h2>

<div class="alert alert-success">
✅ Operation completed successfully
</div>

<div class="alert alert-error">
❌ Something went wrong
</div>
</div>

<!-- Avatar -->
<div class="section">
<h2>Avatar</h2>

<div class="avatar">JD</div>
</div>

<!-- Modal -->
<div class="section">
<h2>Modal Component</h2>

<div class="modal">
<h3>Confirmation</h3>
<p>Are you sure you want to continue?</p>
<br>
<button class="btn btn-primary">Confirm</button>
</div>
</div>

<!-- Progress -->
<div class="section">
<h2>Progress Bar</h2>

<div class="progress">
<div class="progress-fill"></div>
</div>

<p style="margin-top:10px;">75% Complete</p>
</div>

</div>

</body>
</html>
