<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Navigation UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

/* Navbar */
.navbar{
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 8%;
    position:sticky;
    top:0;
}

.logo{
    font-size:1.5rem;
    font-weight:bold;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.nav-links a:hover{
    color:#38bdf8;
}

.cta-btn{
    background:#3b82f6;
    color:white;
    padding:10px 18px;
    border-radius:6px;
    text-decoration:none;
}

.cta-btn:hover{
    background:#2563eb;
}

/* Mobile Menu Button */
.menu-btn{
    display:none;
    font-size:28px;
    cursor:pointer;
}

/* Responsive */
@media(max-width:768px){

    .menu-btn{
        display:block;
    }

    .nav-links{
        position:absolute;
        top:70px;
        left:0;
        width:100%;
        background:#0f172a;
        flex-direction:column;
        text-align:center;
        display:none;
        padding:20px 0;
    }

    .nav-links.active{
        display:flex;
    }

    .cta-btn{
        display:none;
    }
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo">BrandLogo</div>

    <ul class="nav-links" id="navLinks">
        <li><a href="#">Home</a></li>
        <li><a href="#">Features</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Pricing</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <a href="#" class="cta-btn">Get Started</a>

    <div class="menu-btn" onclick="toggleMenu()">
        ☰
    </div>
</nav>

<script>
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
</html>
