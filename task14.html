<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    padding:20px;
}

.signup-container{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.signup-container h2{
    text-align:center;
    color:#333;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    color:#555;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#4facfe;
}

.signup-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4facfe;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.signup-btn:hover{
    background:#2196f3;
}

.terms{
    margin-bottom:18px;
    font-size:14px;
    color:#555;
}

.login-link{
    text-align:center;
    margin-top:18px;
}

.login-link a{
    text-decoration:none;
    color:#4facfe;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="signup-container">
    <h2>Create Account</h2>

    <form>
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Create a password" required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm your password" required>
        </div>

        <div class="terms">
            <input type="checkbox" required>
            I agree to the Terms & Conditions
        </div>

        <button type="submit" class="signup-btn">
            Sign Up
        </button>

        <div class="login-link">
            Already have an account?
            <a href="#">Login</a>
        </div>
    </form>
</div>

</body>
</html>
