<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

.about{
    max-width:1200px;
    margin:50px auto;
    padding:20px;
}

.about h1{
    text-align:center;
    color:#333;
    margin-bottom:30px;
}

.about-container{
    display:flex;
    align-items:center;
    gap:30px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.about-image img{
    width:100%;
    max-width:450px;
    border-radius:10px;
}

.about-content h2{
    color:#007bff;
    margin-bottom:15px;
}

.about-content p{
    line-height:1.8;
    color:#555;
    margin-bottom:15px;
}

.btn{
    display:inline-block;
    padding:12px 25px;
    background:#007bff;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.btn:hover{
    background:#0056b3;
}

@media(max-width:768px){
    .about-container{
        flex-direction:column;
        text-align:center;
    }
}
</style>
</head>

<body>

<section class="about">
    <h1>About Us</h1>

    <div class="about-container">

        <div class="about-image">
            <img src="https://via.placeholder.com/450x300" alt="About Us">
        </div>

        <div class="about-content">
            <h2>Who We Are</h2>
            <p>
                We are a passionate team dedicated to creating innovative
                web solutions. Our goal is to provide high-quality,
                user-friendly, and responsive websites.
            </p>

            <p>
                With years of experience in web development and design,
                we help businesses establish a strong online presence.
            </p>

            <a href="#" class="btn">Learn More</a>
        </div>

    </div>
</section>

</body>
</html>
