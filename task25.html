<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.cart-container{
    width:900px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    overflow:hidden;
}

.cart-header{
    background:#007bff;
    color:white;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.cart-content{
    display:flex;
    flex-wrap:wrap;
}

.cart-items{
    flex:2;
    padding:20px;
}

.cart-item{
    display:flex;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding:15px 0;
}

.cart-item img{
    width:100px;
    height:100px;
    border-radius:8px;
    margin-right:15px;
}

.item-details{
    flex:1;
}

.item-details h3{
    margin-bottom:8px;
    color:#333;
}

.item-details p{
    color:#666;
    margin-bottom:5px;
}

.price{
    color:#28a745;
    font-weight:bold;
    font-size:18px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:10px;
}

.quantity button{
    width:30px;
    height:30px;
    border:none;
    background:#007bff;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.cart-summary{
    flex:1;
    background:#fafafa;
    padding:20px;
    border-left:1px solid #ddd;
}

.cart-summary h2{
    margin-bottom:20px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}

.total{
    font-size:22px;
    font-weight:bold;
    color:#333;
}

.checkout-btn{
    width:100%;
    padding:14px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-top:20px;
}

.checkout-btn:hover{
    background:#218838;
}
</style>
</head>
<body>

<div class="cart-container">

    <div class="cart-header">
        🛒 Shopping Cart
    </div>

    <div class="cart-content">

        <div class="cart-items">

            <div class="cart-item">
                <img src="https://via.placeholder.com/100" alt="Product">
                
                <div class="item-details">
                    <h3>Wireless Headphones</h3>
                    <p>Noise Cancellation</p>
                    <div class="price">₹2,999</div>
                </div>

                <div class="quantity">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </div>

            <div class="cart-item">
                <img src="https://via.placeholder.com/100" alt="Product">
                
                <div class="item-details">
                    <h3>Smart Watch</h3>
                    <p>Fitness Tracker</p>
                    <div class="price">₹4,499</div>
                </div>

                <div class="quantity">
                    <button>-</button>
                    <span>2</span>
                    <button>+</button>
                </div>
            </div>

        </div>

        <div class="cart-summary">
            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span>₹7,498</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span>₹100</span>
            </div>

            <div class="summary-row total">
                <span>Total</span>
                <span>₹7,598</span>
            </div>

            <button class="checkout-btn">
                Proceed to Checkout
            </button>
        </div>

    </div>

</div>

</body>
</html>
