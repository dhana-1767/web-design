<!DOCTYPE html>
<html>
<head>
<title>Social Media Post</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.post{
    width:400px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.banner{
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    color:white;
    text-align:center;
    padding:40px 20px;
}

.banner h1{
    font-size:32px;
    margin-bottom:10px;
}

.banner p{
    font-size:16px;
}

.content{
    padding:25px;
    text-align:center;
}

.content h2{
    color:#333;
    margin-bottom:10px;
}

.content p{
    color:#666;
    line-height:1.6;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#2575fc;
    color:white;
    text-decoration:none;
    border-radius:30px;
    transition:0.3s;
}

.btn:hover{
    background:#1a5edb;
}

.footer{
    display:flex;
    justify-content:space-around;
    padding:15px;
    border-top:1px solid #eee;
    color:#777;
}
</style>
</head>
<body>

<div class="post">
    <div class="banner">
        <h1>🔥 Mega Sale</h1>
        <p>Up to 70% OFF on All Products</p>
    </div>

    <div class="content">
        <h2>Limited Time Offer</h2>
        <p>
            Grab your favorite products at unbeatable prices.
            Don't miss out on this exclusive deal!
        </p>
        <a href="#" class="btn">Shop Now</a>
    </div>

    <div class="footer">
        <span>❤️ 2.5K</span>
        <span>💬 480</span>
        <span>📤 Share</span>
    </div>
</div>

</body>
</html>
