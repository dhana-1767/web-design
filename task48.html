<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagination Design</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f9;
    font-family:Arial, sans-serif;
}

.pagination{
    display:flex;
    gap:8px;
}

.pagination a{
    text-decoration:none;
    color:#333;
    background:#fff;
    padding:12px 16px;
    border-radius:8px;
    border:1px solid #ddd;
    transition:0.3s;
    font-weight:bold;
}

.pagination a:hover{
    background:#007bff;
    color:white;
    border-color:#007bff;
}

.pagination a.active{
    background:#007bff;
    color:white;
    border-color:#007bff;
}
</style>
</head>
<body>

<div class="pagination">
    <a href="#">&laquo;</a>
    <a href="#">1</a>
    <a href="#" class="active">2</a>
    <a href="#">3</a>
    <a href="#">4</a>
    <a href="#">5</a>
    <a href="#">&raquo;</a>
</div>

</body>
</html>
