<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Footer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.content{
    flex:1;
    padding:20px;
}

footer{
    background:#222;
    color:white;
    padding:30px 20px;
}

.footer-container{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:20px;
}

.footer-section{
    flex:1;
    min-width:200px;
}

.footer-section h3{
    margin-bottom:15px;
}

.footer-section ul{
    list-style:none;
}

.footer-section ul li{
    margin-bottom:8px;
}

.footer-section ul li a{
    color:white;
    text-decoration:none;
}

.footer-section ul li a:hover{
    color:#00bfff;
}

.social-links a{
    color:white;
    text-decoration:none;
    margin-right:15px;
}

.social-links a:hover{
    color:#00bfff;
}

.footer-bottom{
    text-align:center;
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid #555;
}

/* Responsive Design */
@media (max-width:768px){
    .footer-container{
        flex-direction:column;
        text-align:center;
    }
}
</style>
</head>
<body>

<div class="content">
    <h1>Website Content</h1>
</div>

<footer>
    <div class="footer-container">

        <div class="footer-section">
            <h3>About Us</h3>
            <p>We provide quality web solutions and responsive designs.</p>
        </div>

        <div class="footer-section">
            <h3>Quick Links</h3>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>

        <div class="footer-section">
            <h3>Follow Us</h3>
            <div class="social-links">
                <a href="#">Facebook</a>
                <a href="#">Instagram</a>
                <a href="#">Twitter</a>
            </div>
        </div>

    </div>

    <div class="footer-bottom">
        <p>&copy; 2026 Your Company. All Rights Reserved.</p>
    </div>
</footer>

</body>
</html>
