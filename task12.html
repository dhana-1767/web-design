<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg, #667eea, #764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.contact-container{
    background:#fff;
    width:100%;
    max-width:900px;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    display:flex;
    flex-wrap:wrap;
}

.contact-info{
    flex:1;
    min-width:300px;
    background:#4f46e5;
    color:#fff;
    padding:40px;
}

.contact-info h2{
    margin-bottom:20px;
    font-size:32px;
}

.contact-info p{
    line-height:1.8;
    margin-bottom:15px;
}

.contact-form{
    flex:1;
    min-width:300px;
    padding:40px;
}

.contact-form h2{
    color:#333;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:20px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px 15px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    font-size:16px;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#4f46e5;
}

.form-group textarea{
    resize:none;
    height:120px;
}

.btn{
    width:100%;
    padding:14px;
    background:#4f46e5;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#3730a3;
}

@media(max-width:768px){
    .contact-container{
        flex-direction:column;
    }
}
</style>
</head>
<body>

<div class="contact-container">

    <div class="contact-info">
        <h2>Contact Us</h2>
        <p>📍 Salem, Tamil Nadu, India</p>
        <p>📞 +91 98765 43210</p>
        <p>✉️ info@example.com</p>
        <p>We're here to answer your questions and help you with your projects.</p>
    </div>

    <div class="contact-form">
        <h2>Send a Message</h2>

        <form>
            <div class="form-group">
                <input type="text" placeholder="Your Name" required>
            </div>

            <div class="form-group">
                <input type="email" placeholder="Your Email" required>
            </div>

            <div class="form-group">
                <input type="text" placeholder="Subject" required>
            </div>

            <div class="form-group">
                <textarea placeholder="Your Message" required></textarea>
            </div>

            <button type="submit" class="btn">
                Send Message
            </button>
        </form>
    </div>

</div>

</body>
</html>
