<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

.hero{
    height:100vh;
    background:linear-gradient(rgba(0,0,0,0.5),
               rgba(0,0,0,0.5)),
               url("https://images.unsplash.com/photo-1498050108023-c5249f4df085");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero-content h1{
    font-size:3rem;
    margin-bottom:15px;
}

.hero-content p{
    font-size:1.2rem;
    margin-bottom:20px;
}

.btn{
    display:inline-block;
    padding:12px 25px;
    background:#007bff;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.btn:hover{
    background:#0056b3;
}

@media(max-width:768px){
    .hero-content h1{
        font-size:2rem;
    }

    .hero-content p{
        font-size:1rem;
    }
}
</style>
</head>

<body>

<section class="hero">
    <div class="hero-content">
        <h1>Welcome to Our Website</h1>
        <p>Create amazing and responsive web designs.</p>
        <a href="#" class="btn">Get Started</a>
    </div>
</section>

</body>
</html>
