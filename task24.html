<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Card</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.product-card{
    width:320px;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    transition:0.3s;
}

.product-card:hover{
    transform:translateY(-8px);
}

.product-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-info{
    padding:20px;
}

.product-title{
    font-size:22px;
    margin-bottom:10px;
    color:#333;
}

.product-description{
    color:#666;
    font-size:14px;
    margin-bottom:15px;
    line-height:1.5;
}

.price{
    font-size:24px;
    color:#28a745;
    font-weight:bold;
    margin-bottom:15px;
}

.buy-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#007bff;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.buy-btn:hover{
    background:#0056b3;
}
</style>
</head>
<body>

<div class="product-card">
    <img src="https://via.placeholder.com/320x220" alt="Product">
    
    <div class="product-info">
        <h2 class="product-title">Wireless Headphones</h2>
        
        <p class="product-description">
            Premium sound quality with noise cancellation and long battery life.
        </p>
        
        <div class="price">₹2,999</div>
        
        <button class="buy-btn">Add to Cart</button>
    </div>
</div>

</body>
</html>
