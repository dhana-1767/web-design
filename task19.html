<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}

.settings-container{
    max-width:900px;
    margin:auto;
    background:#fff;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    overflow:hidden;
}

.settings-header{
    background:#4f46e5;
    color:#fff;
    padding:25px;
    text-align:center;
}

.settings-content{
    padding:30px;
}

.section{
    margin-bottom:30px;
}

.section h3{
    margin-bottom:15px;
    color:#333;
    border-bottom:2px solid #eee;
    padding-bottom:10px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#555;
}

.form-group input,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#4f46e5;
}

/* Toggle Switch */
.toggle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.switch{
    position:relative;
    width:50px;
    height:25px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:#ccc;
    border-radius:25px;
    cursor:pointer;
    transition:0.3s;
}

.slider:before{
    content:"";
    position:absolute;
    width:19px;
    height:19px;
    left:3px;
    top:3px;
    background:#fff;
    border-radius:50%;
    transition:0.3s;
}

input:checked + .slider{
    background:#4f46e5;
}

input:checked + .slider:before{
    transform:translateX(25px);
}

.save-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.save-btn:hover{
    background:#3730a3;
}

@media(max-width:768px){
    body{
        padding:15px;
    }
}
</style>
</head>
<body>

<div class="settings-container">

    <div class="settings-header">
        <h2>Account Settings</h2>
    </div>

    <div class="settings-content">

        <!-- Profile Settings -->
        <div class="section">
            <h3>Profile Information</h3>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" value="Dhana">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" value="dhana@example.com">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" value="+91 9876543210">
            </div>
        </div>

        <!-- Preferences -->
        <div class="section">
            <h3>Preferences</h3>

            <div class="form-group">
                <label>Language</label>
                <select>
                    <option>English</option>
                    <option>Tamil</option>
                    <option>Hindi</option>
                </select>
            </div>

            <div class="form-group">
                <label>Theme</label>
                <select>
                    <option>Light</option>
                    <option>Dark</option>
                </select>
            </div>
        </div>

        <!-- Notifications -->
        <div class="section">
            <h3>Notifications</h3>

            <div class="toggle">
                <span>Email Notifications</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle">
                <span>SMS Notifications</span>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle">
                <span>Push Notifications</span>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Security -->
        <div class="section">
            <h3>Security</h3>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" placeholder="Enter new password">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm password">
            </div>
        </div>

        <button class="save-btn">
            Save Changes
        </button>

    </div>

</div>

</body>
</html>
