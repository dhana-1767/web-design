<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Icon</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f4f4f4;
}

.app-icon{
    width:200px;
    height:200px;
    border-radius:45px;
    background:linear-gradient(135deg,#6366F1,#8B5CF6);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:90px;
    color:white;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
    transition:0.3s;
}

.app-icon:hover{
    transform:scale(1.05);
}
</style>
</head>
<body>

<div class="app-icon">
    🚀
</div>

</body>
</html>
