<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Thumbnail</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.thumbnail{
    width:1280px;
    height:720px;
    background:linear-gradient(135deg,#ff0000,#ff6a00);
    position:relative;
    overflow:hidden;
    border-radius:20px;
    color:white;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
}

.circle1{
    width:350px;
    height:350px;
    top:-100px;
    right:-100px;
}

.circle2{
    width:250px;
    height:250px;
    bottom:-80px;
    left:-80px;
}

.content{
    position:absolute;
    left:80px;
    top:50%;
    transform:translateY(-50%);
}

.content h1{
    font-size:90px;
    font-weight:900;
    text-transform:uppercase;
    line-height:1.1;
    text-shadow:4px 4px 10px rgba(0,0,0,0.3);
}

.content p{
    font-size:35px;
    margin-top:20px;
    font-weight:bold;
}

.badge{
    display:inline-block;
    margin-top:25px;
    background:#fff;
    color:#ff0000;
    padding:15px 35px;
    border-radius:50px;
    font-size:28px;
    font-weight:bold;
}

.image-area{
    position:absolute;
    right:80px;
    top:50%;
    transform:translateY(-50%);
    font-size:260px;
}

.play-btn{
    position:absolute;
    top:30px;
    left:30px;
    font-size:60px;
}
</style>
</head>

<body>

<div class="thumbnail">

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <div class="play-btn">▶️</div>

    <div class="content">
        <h1>Learn Web<br>Design Fast</h1>
        <p>Complete Beginner Tutorial</p>
        <div class="badge">WATCH NOW</div>
    </div>

    <div class="image-area">
        👨‍💻
    </div>

</div>

</body>
</html>
